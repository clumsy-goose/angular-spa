<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>系统维护中 - Angular SPA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1e293b; background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .card { background: white; border-radius: 16px; padding: 48px; max-width: 480px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
      .icon { font-size: 4rem; margin-bottom: 16px; }
      h1 { font-size: 1.75rem; color: #dd0031; margin-bottom: 12px; }
      p { color: #64748b; margin-bottom: 8px; line-height: 1.6; }
      .time { background: #f5f5f5; border-radius: 8px; padding: 12px 20px; margin: 24px 0; display: inline-block; font-weight: 500; color: #334155; }
      a.back { display: inline-block; margin-top: 24px; color: #dd0031; text-decoration: none; font-weight: 500; padding: 10px 24px; border: 2px solid #dd0031; border-radius: 8px; transition: all 0.2s; }
      a.back:hover { background: #dd0031; color: white; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🔧</div>
      <h1>系统维护中</h1>
      <p>我们正在进行系统升级和维护，请稍后再试。</p>
      <div class="time">预计恢复时间：2026-04-01 18:00</div>
      <br />
      <a class="back" href="/">返回首页</a>
    </div>
  </body>
</html>
