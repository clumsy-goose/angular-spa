<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>隐私政策 - Angular SPA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1e293b; background: #f8fafc; line-height: 1.7; }
      .container { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
      h1 { font-size: 2rem; margin-bottom: 8px; color: #dd0031; }
      .meta { color: #64748b; font-size: 0.875rem; margin-bottom: 32px; }
      h2 { font-size: 1.25rem; margin: 24px 0 12px; color: #334155; }
      p { margin-bottom: 16px; color: #475569; }
      ul { margin: 0 0 16px 24px; color: #475569; }
      li { margin-bottom: 8px; }
      a.back { display: inline-block; margin-top: 32px; color: #dd0031; text-decoration: none; font-weight: 500; }
      a.back:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>隐私政策</h1>
      <p class="meta">最后更新：2026 年 4 月 1 日</p>
      <h2>1. 信息收集</h2>
      <p>本演示项目不会主动收集任何用户个人信息。</p>
      <h2>2. Cookie 使用</h2>
      <ul>
        <li><strong>必要 Cookie</strong>：维持页面基本功能所需</li>
        <li><strong>分析 Cookie</strong>：用于了解页面访问情况</li>
      </ul>
      <h2>3. 数据存储</h2>
      <p>本应用可能使用浏览器的 localStorage 来存储用户偏好，数据仅存储在本地。</p>
      <a class="back" href="/">← 返回首页</a>
    </div>
  </body>
</html>
